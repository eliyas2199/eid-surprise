<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eid Mubarak Surprise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Stars & Fireflies Background Layers -->
    <div id="stars-container"></div>
    <div id="fireflies-container"></div>
    <div id="hearts-container"></div>

    <!-- Hanging Lanterns -->
    <div class="lantern lantern-left">
        <div class="thread"></div>
        <div class="lantern-cap"></div>
        <div class="lantern-body">
            <div class="lantern-light"></div>
        </div>
        <div class="lantern-tassel"></div>
    </div>

    <div class="lantern lantern-right">
        <div class="thread"></div>
        <div class="lantern-cap"></div>
        <div class="lantern-body">
            <div class="lantern-light"></div>
        </div>
        <div class="lantern-tassel"></div>
    </div>

    <!-- Main Magical Moon (The Controller) -->
    <div id="moon-container">
        <div id="moon" class="moon">
            <div class="moon-texture"></div>
        </div>
    </div>

    <!-- Media Display Area -->
    <div class="display-container">
        <!-- Stage 1 & 3 Images -->
        <div class="image-wrapper">
            <img id="gf-image" src="gf5.jpg" alt="Special Someone" class="surprise-img">
            <img id="couple-image" src="couple.png" alt="Couple" class="surprise-img">
        </div>

        <!-- Stage 2 & 3 Typography -->
        <div class="text-wrapper">
            <h1 id="text-stage2" class="eid-text gold-glow"></h1>
            <h2 id="text-stage3" class="love-text romantic-glow"></h2>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="eid-song" src="eid-song.mp3" preload="auto"></audio>
    <audio id="couple-song" src="couple-song.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
